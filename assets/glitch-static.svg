<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <filter id="rgb" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".48 .91" numOctaves="2" seed="41" stitchTiles="stitch"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="3.3" intercept="-1.85"/>
